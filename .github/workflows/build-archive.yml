name: Build historical recipe archive
on:
  workflow_dispatch:
  push:
    paths:
      - 'build_archive.py'
      - '.github/workflows/build-archive.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python build_archive.py
      - name: Commit generated pages and pictures
        run: |
          git config user.name "archive-builder"
          git config user.email "archive-builder@users.noreply.github.com"
          git add index.html style.css recipes-archive.json recipe/ images/
          git diff --cached --quiet || (git commit -m "Generate historical recipe pages with licensed images" && git push)
